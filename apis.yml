aid: reloadly
name: Reloadly
description: >-
  Reloadly is a global digital rewards and payments platform providing APIs for sending digital gift cards, airtime
  top-ups, and data bundles worldwide. The platform connects businesses to 3,000+ gift card brands across 14,000+
  products in 140+ countries and 800+ mobile operators in 170+ countries. Reloadly's REST APIs use OAuth 2.0 client
  credentials authentication with separate sandbox and production environments.
